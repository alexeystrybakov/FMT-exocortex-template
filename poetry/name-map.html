<title>Карта имён — Астра Оиф</title>
<style>
:root {
  --bg: #F2EDE4; --text: #2C231A; --muted: #9A8F84;
  --nd-bg: rgba(44,35,26,0.04); --nd-bd: rgba(44,35,26,0.11);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #130F0B; --text: #DDD5C4; --muted: #6A6058;
  --nd-bg: rgba(221,213,196,0.05); --nd-bd: rgba(221,213,196,0.11);
}}
:root[data-theme="dark"]  {
  --bg: #130F0B; --text: #DDD5C4; --muted: #6A6058;
  --nd-bg: rgba(221,213,196,0.05); --nd-bd: rgba(221,213,196,0.11);
}
:root[data-theme="light"] {
  --bg: #F2EDE4; --text: #2C231A; --muted: #9A8F84;
  --nd-bg: rgba(44,35,26,0.04); --nd-bd: rgba(44,35,26,0.11);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  min-height: 100vh;
  padding: 2.5rem 1.5rem 5rem;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  max-width: 1100px;
  margin: 0 auto 2.8rem;
}
.eyebrow {
  font-size: 0.68rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
}
.theme-btn {
  background: none;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.26rem 0.65rem;
  border-radius: 2px;
  cursor: pointer;
  font-family: inherit;
}
.theme-btn:hover { color: var(--text); border-color: var(--text); }

.graph-wrapper {
  position: relative;
  max-width: 1100px;
  margin: 0 auto;
}
#connections {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
  z-index: 0;
}
.graph {
  display: grid;
  grid-template-columns: 232px 1fr 298px;
  position: relative;
  z-index: 1;
}

/* ── Poems ── */
.poems-col {
  display: flex;
  flex-direction: column;
  gap: 2rem;
  padding: 1rem 0;
  align-self: center;
}
.poem-box {
  padding: 1.4rem 1rem;
  border-radius: 2px;
  cursor: default;
  transition: opacity 0.18s;
}
.poem-box[data-pid="p-dog"]   { background: #6B3A4A; }
.poem-box[data-pid="p-tysy"]  { background: #4270A8; }
.poem-box[data-pid="p-nic"]   { background: #8C5A36; }
.poem-box[data-pid="p-tree"]  { background: #3D6B4A; }
.poem-box[data-pid="p-drozd"] { background: #4A7A8A; }
.poem-title {
  color: #fff;
  font-style: italic;
  font-size: 0.84rem;
  line-height: 1.5;
  margin-bottom: 0.4rem;
}
.poem-year {
  color: rgba(255,255,255,0.55);
  font-size: 0.63rem;
  letter-spacing: 0.07em;
}
.poem-idea {
  color: rgba(255,255,255,0.42);
  font-size: 0.66rem;
  font-style: italic;
  margin-top: 0.65rem;
  padding-top: 0.5rem;
  border-top: 1px solid rgba(255,255,255,0.14);
  line-height: 1.4;
}

/* ── Names ── */
.names-col {
  display: flex;
  flex-direction: column;
  padding: 1rem 0;
}
.name-group {
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
}
.name-group + .name-group { margin-top: 0.28rem; }
.name-node {
  display: flex;
  flex-direction: column;
  padding: 0.26rem 0.65rem;
  border-radius: 2px;
  background: var(--nd-bg);
  border: 1px solid var(--nd-bd);
  cursor: default;
  transition: opacity 0.18s;
}
.n-name {
  font-size: 0.76rem;
  color: var(--text);
  line-height: 1.4;
}
.n-tag {
  font-size: 0.6rem;
  font-style: italic;
  color: var(--muted);
  line-height: 1.3;
  margin-top: 0.05rem;
}

.faded { opacity: 0.1 !important; }

/* ── Legend ── */
.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1.8rem;
  margin: 3rem auto 0;
  max-width: 1100px;
  font-size: 0.67rem;
  color: var(--muted);
  letter-spacing: 0.07em;
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.legend-note {
  width: 100%;
  text-align: center;
  font-size: 0.62rem;
  color: var(--muted);
  margin-top: 0.7rem;
  font-style: italic;
}
</style>

<div class="top">
  <p class="eyebrow">Карта имён — Астра Оиф</p>
  <button class="theme-btn" onclick="toggleTheme()">тема</button>
</div>

<div class="graph-wrapper">
  <svg id="connections" aria-hidden="true"></svg>
  <div class="graph">
    <div class="poems-col" id="poems-col"></div>
    <div></div>
    <div class="names-col" id="names-col"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="leg-dot" style="background:#4270A8"></div>«Тысячеглазый»</div>
  <div class="legend-item"><div class="leg-dot" style="background:#8C5A36"></div>«...ничтоже»</div>
  <div class="legend-item"><div class="leg-dot" style="background:#6B3A4A"></div>«Черноглазый пёс»</div>
  <div class="legend-item"><div class="leg-dot" style="background:#3D6B4A"></div>«Дерево»</div>
  <div class="legend-item"><div class="leg-dot" style="background:#4A7A8A"></div>«Чёрный дрозд»</div>
  <p class="legend-note">имена в нескольких поэмах получают кривые разных цветов</p>
</div>

<script>
var POEMS = [
  {id:'p-tysy',  title:'«Тысячеглазый»',                                  year:'2026', idea:'быть всем и не знать себя'},
  {id:'p-nic',   title:'«… и҆ ничто́же невозмо́жно бꙋ́детъ ва́мъ»',        year:'2026', idea:'несу в себе начало всех начал'},
  {id:'p-dog',   title:'«Боль черноглазого пса»',                         year:'2026', idea:'тьма входит сама — и уходит сама'},
  {id:'p-tree',  title:'«Дерево»',                                         year:'2026', idea:'не дерево в тумане — в дереве туман'},
  {id:'p-drozd', title:'«Чёрный дрозд и собирательница ягод на болоте»',  year:'2025', idea:'камень — ответ на свет'}
];

var GROUPS = [
  [
    {id:'n-avg',     name:'Августин',                   tag:'источник — в тебе самом'},
    {id:'n-indra',   name:'Аватамсака / Сеть Индры',    tag:'каждая точка отражает весь мир'},
    {id:'n-arist',   name:'Аристотель',                 tag:'плод несёт в себе причину'},
    {id:'n-beck',    name:'Беккет',                     tag:'движение без движения'},
    {id:'n-borh',    name:'Борхес',                     tag:'всё разом — синтез невозможен'},
    {id:'n-buddh',   name:'Буддизм',                    tag:'сансара, пробуждение, бодхисаттва'},
    {id:'n-hegel',   name:'Гегель',                     tag:'мышление открывает основу бытия'},
    {id:'n-hoelder', name:'Гельдерлин',                 tag:'где опасность — там спасительное'},
    {id:'n-herakl',  name:'Гераклит',                   tag:'скрытый логос за борьбой'},
    {id:'n-gorac',   name:'Гораций',                    tag:'начни с сути, а не с яйца'},
    {id:'n-pal',     name:'Григорий Палама',            tag:'нетварный свет — внутри'},
    {id:'n-dante',   name:'Данте',                      tag:'ров без ступеней вверх'},
    {id:'n-dion',    name:'Дионисий Ареопагит',         tag:'бог познаётся через отрицание'},
    {id:'n-dost',    name:'Достоевский',                tag:'знает — и всё равно не действует'},
    {id:'n-ioann',   name:'Евангелие от Иоанна',        tag:'зерно умирает — плод живёт'},
    {id:'n-mat',     name:'Евангелие от Матфея',        tag:'вера сдвигает горы'},
    {id:'n-calder',  name:'Кальдерон де ла Барка',      tag:'жизнь — сон, но кто снится'},
    {id:'n-kant',    name:'Кант',                       tag:'за чувственным — умопостигаемое'},
    {id:'n-celtic',  name:'Кельтская традиция',         tag:'чёрный дрозд — вестник из света'},
    {id:'n-iov',     name:'Книга Иова',                 tag:'тишина в ответ на вопрос'},
    {id:'n-kier',    name:'Кьеркегор',                  tag:'отчаяние парализует'},
    {id:'n-leibn',   name:'Лейбниц',                    tag:'каждый глаз отражает всё'},
    {id:'n-buber',   name:'Мартин Бубер',               tag:'я рождается во встрече'},
    {id:'n-ekhart',  name:'Мейстер Экхарт',             tag:'основа души = основа бога'},
    {id:'n-drake',   name:'Ник Дрейк',                  tag:'пёс знает твоё имя'},
    {id:'n-kuz',     name:'Николай Кузанский',          tag:'бесконечное совпадает с точкой'},
    {id:'n-nietz',   name:'Ницше',                      tag:'круг, который изматывает'},
    {id:'n-parm',    name:'Парменид',                   tag:'истина не в явлениях'},
    {id:'n-pess',    name:'Пессоа',                     tag:'каждое я реально и полно'},
    {id:'n-pindar',  name:'Пиндар',                     tag:'стань тем, кто ты есть'},
    {id:'n-platon',  name:'Платон',                     tag:'апория как порог познания'},
    {id:'n-plotin',  name:'Плотин',                     tag:'из единого — и к единому'},
    {id:'n-ilya',    name:'Пророк Илия',                tag:'глас безмолвный после бури'},
    {id:'n-psalms',  name:'Псалмы',                     tag:'вопль в пустоту'},
    {id:'n-rilke',   name:'Рильке',                     tag:'встреча требует ответа всем существом'},
    {id:'n-sartr',   name:'Сартр',                      tag:'если сам не освобожу — кто?'},
    {id:'n-solit',   name:'Солитоны',                   tag:'форма сохраняется сквозь столкновения'},
    {id:'n-spin',    name:'Спиноза',                    tag:'несу в себе свою причину'},
    {id:'n-stoic',   name:'Стоицизм / Эпиктет',        tag:'власть над собой, не над волнами'},
    {id:'n-blake',   name:'Уильям Блейк',               tag:'умственные кандалы куёт сам человек'},
    {id:'n-whitm',   name:'Уитмен',                     tag:'я содержу в себе множества'},
    {id:'n-upan',    name:'Упанишады / Рамана Махарши', tag:'кто остаётся за формами'},
    {id:'n-feniks',  name:'Феникс',                     tag:'сам себя сжигает'},
    {id:'n-ficht',   name:'Фихте',                      tag:'препятствие как условие роста'},
    {id:'n-heideg',  name:'Хайдеггер',                  tag:'рулевой не знает себя'},
    {id:'n-church',  name:'Черчилль',                   tag:'пёс приходит без приглашения'},
    {id:'n-zhuang',  name:'Чжуанцзы',                   tag:'кто я: человек или бабочка'},
    {id:'n-shell',   name:'Шеллинг',                    tag:'вечность видит себя через нас'},
    {id:'n-ekk',     name:'Экклезиаст',                 tag:'тщетность как отправная точка'},
    {id:'n-ekh-il',  name:'Экхарт / Илия',              tag:'Безмолвный Голос — тождество'},
    {id:'n-emp',     name:'Эмпедокл',                   tag:'стихии и борьба в нас'},
    {id:'n-yung',    name:'Юнг',                        tag:'тень — непризнанное «я»'}
  ]
];

var CONNS = [
  /* Черноглазый пёс — 11 */
  ['p-dog','n-yung',   '#6B3A4A'], ['p-dog','n-dante',  '#6B3A4A'],
  ['p-dog','n-arist',  '#6B3A4A'], ['p-dog','n-church', '#6B3A4A'],
  ['p-dog','n-kier',   '#6B3A4A'], ['p-dog','n-nietz',  '#6B3A4A'],
  ['p-dog','n-psalms', '#6B3A4A'], ['p-dog','n-iov',    '#6B3A4A'],
  ['p-dog','n-buddh',  '#6B3A4A'], ['p-dog','n-drake',  '#6B3A4A'],
  ['p-dog','n-beck',   '#6B3A4A'],
  /* Тысячеглазый — 17 */
  ['p-tysy','n-parm',   '#4270A8'], ['p-tysy','n-emp',    '#4270A8'],
  ['p-tysy','n-herakl', '#4270A8'], ['p-tysy','n-platon', '#4270A8'],
  ['p-tysy','n-leibn',  '#4270A8'], ['p-tysy','n-kuz',    '#4270A8'],
  ['p-tysy','n-plotin', '#4270A8'], ['p-tysy','n-hegel',  '#4270A8'],
  ['p-tysy','n-buber',  '#4270A8'], ['p-tysy','n-ekhart', '#4270A8'],
  ['p-tysy','n-upan',   '#4270A8'], ['p-tysy','n-borh',   '#4270A8'],
  ['p-tysy','n-whitm',  '#4270A8'], ['p-tysy','n-pess',   '#4270A8'],
  ['p-tysy','n-zhuang', '#4270A8'], ['p-tysy','n-indra',  '#4270A8'],
  ['p-tysy','n-calder', '#4270A8'],
  /* …ничтоже — 16 */
  ['p-nic','n-mat',    '#8C5A36'], ['p-nic','n-ioann',  '#8C5A36'],
  ['p-nic','n-ekk',    '#8C5A36'], ['p-nic','n-ilya',   '#8C5A36'],
  ['p-nic','n-platon', '#8C5A36'], ['p-nic','n-arist',  '#8C5A36'],
  ['p-nic','n-plotin', '#8C5A36'], ['p-nic','n-avg',    '#8C5A36'],
  ['p-nic','n-ekhart', '#8C5A36'], ['p-nic','n-pal',    '#8C5A36'],
  ['p-nic','n-spin',   '#8C5A36'], ['p-nic','n-kant',   '#8C5A36'],
  ['p-nic','n-ficht',  '#8C5A36'], ['p-nic','n-hegel',  '#8C5A36'],
  ['p-nic','n-shell',  '#8C5A36'], ['p-nic','n-dion',   '#8C5A36'],
  /* Дерево — 18 */
  ['p-tree','n-platon',  '#3D6B4A'], ['p-tree','n-kant',    '#3D6B4A'],
  ['p-tree','n-hegel',   '#3D6B4A'], ['p-tree','n-heideg',  '#3D6B4A'],
  ['p-tree','n-yung',    '#3D6B4A'], ['p-tree','n-nietz',   '#3D6B4A'],
  ['p-tree','n-sartr',   '#3D6B4A'], ['p-tree','n-blake',   '#3D6B4A'],
  ['p-tree','n-dost',    '#3D6B4A'], ['p-tree','n-pindar',  '#3D6B4A'],
  ['p-tree','n-ekh-il',  '#3D6B4A'], ['p-tree','n-buddh',   '#3D6B4A'],
  ['p-tree','n-gorac',   '#3D6B4A'], ['p-tree','n-feniks',  '#3D6B4A'],
  ['p-tree','n-solit',   '#3D6B4A'], ['p-tree','n-hoelder', '#3D6B4A'],
  ['p-tree','n-stoic',   '#3D6B4A'], ['p-tree','n-rilke',   '#3D6B4A'],
  /* Чёрный дрозд — 10 */
  ['p-drozd','n-mat',    '#4A7A8A'], ['p-drozd','n-iov',    '#4A7A8A'],
  ['p-drozd','n-platon', '#4A7A8A'], ['p-drozd','n-yung',   '#4A7A8A'],
  ['p-drozd','n-stoic',  '#4A7A8A'], ['p-drozd','n-sartr',  '#4A7A8A'],
  ['p-drozd','n-buddh',  '#4A7A8A'], ['p-drozd','n-rilke',  '#4A7A8A'],
  ['p-drozd','n-pal',    '#4A7A8A'], ['p-drozd','n-celtic', '#4A7A8A']
];

var locked = null;

var poemConns = {}, nameConns = {};
CONNS.forEach(function(c) {
  if (!poemConns[c[0]]) poemConns[c[0]] = [];
  poemConns[c[0]].push(c[1]);
  if (!nameConns[c[1]]) nameConns[c[1]] = [];
  nameConns[c[1]].push(c[0]);
});

var poemsCol = document.getElementById('poems-col');
POEMS.forEach(function(p) {
  var box = document.createElement('div');
  box.className = 'poem-box';
  box.dataset.pid = p.id;
  box.innerHTML =
    '<div class="poem-title">'+p.title+'</div>'+
    '<div class="poem-year">'+p.year+'</div>'+
    '<div class="poem-idea">'+p.idea+'</div>';
  box.addEventListener('mouseenter', function() { if (!locked) highlightPoem(p.id); });
  box.addEventListener('mouseleave',  function() { if (!locked) resetAll(); });
  box.addEventListener('click', function() {
    if (locked && locked.type === 'poem' && locked.id === p.id) { locked = null; resetAll(); }
    else { locked = {type:'poem', id:p.id}; highlightPoem(p.id); }
  });
  poemsCol.appendChild(box);
});

var namesCol = document.getElementById('names-col');
GROUPS.forEach(function(grp) {
  var g = document.createElement('div');
  g.className = 'name-group';
  grp.forEach(function(n) {
    var el = document.createElement('div');
    el.className = 'name-node';
    el.dataset.nid = n.id;
    el.innerHTML = '<span class="n-name">'+n.name+'</span><span class="n-tag">'+n.tag+'</span>';
    el.addEventListener('mouseenter', function() { if (!locked) highlightName(n.id); });
    el.addEventListener('mouseleave',  function() { if (!locked) resetAll(); });
    el.addEventListener('click', function() {
      if (locked && locked.type === 'name' && locked.id === n.id) { locked = null; resetAll(); }
      else { locked = {type:'name', id:n.id}; highlightName(n.id); }
    });
    g.appendChild(el);
  });
  namesCol.appendChild(g);
});

var paths = [];

function draw() {
  var svg = document.getElementById('connections');
  var wrap = document.querySelector('.graph-wrapper');
  var wR = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.offsetWidth);
  svg.setAttribute('height', wrap.offsetHeight);
  svg.innerHTML = '';
  paths = [];

  function rel(el) {
    var r = el.getBoundingClientRect();
    return {
      left:  r.left  - wR.left,
      right: r.right - wR.left,
      cy:    r.top   - wR.top + r.height / 2
    };
  }

  CONNS.forEach(function(c) {
    var poem = document.querySelector('[data-pid="'+c[0]+'"]');
    var node = document.querySelector('[data-nid="'+c[1]+'"]');
    if (!poem || !node) return;
    var pR = rel(poem), nR = rel(node);
    var x1 = pR.right, y1 = pR.cy;
    var x2 = nR.left,  y2 = nR.cy;
    var mx = (x1 + x2) / 2;
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    p.setAttribute('stroke', c[2]);
    p.setAttribute('stroke-width', '1.2');
    p.setAttribute('fill', 'none');
    p.setAttribute('opacity', '0.18');
    p.dataset.poem = c[0];
    p.dataset.name = c[1];
    svg.appendChild(p);
    paths.push(p);
  });
}

function highlightPoem(pid) {
  var names = new Set(poemConns[pid] || []);
  document.querySelectorAll('.name-node').forEach(function(el) {
    el.classList.toggle('faded', !names.has(el.dataset.nid));
  });
  document.querySelectorAll('.poem-box').forEach(function(el) {
    el.classList.toggle('faded', el.dataset.pid !== pid);
  });
  paths.forEach(function(p) {
    p.setAttribute('opacity', p.dataset.poem === pid ? '0.7' : '0.03');
  });
}

function highlightName(nid) {
  var poems = new Set(nameConns[nid] || []);
  document.querySelectorAll('.poem-box').forEach(function(el) {
    el.classList.toggle('faded', !poems.has(el.dataset.pid));
  });
  document.querySelectorAll('.name-node').forEach(function(el) {
    el.classList.toggle('faded', el.dataset.nid !== nid);
  });
  paths.forEach(function(p) {
    p.setAttribute('opacity', p.dataset.name === nid ? '0.7' : '0.03');
  });
}

function resetAll() {
  document.querySelectorAll('.poem-box, .name-node').forEach(function(el) {
    el.classList.remove('faded');
  });
  paths.forEach(function(p) { p.setAttribute('opacity', '0.18'); });
}

function toggleTheme() {
  var root = document.documentElement;
  var cur = root.getAttribute('data-theme');
  if (!cur) {
    var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  } else {
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }
  setTimeout(draw, 50);
}

window.addEventListener('load', draw);
window.addEventListener('resize', draw);
</script>
